    }
    const togglePrint = id => { const i = printSel.value.indexOf(id); if (i < 0) printSel.value.push(id); else printSel.value.splice(i, 1); };

    function openExport() {
      Object.assign(modal, { open:true, kind:'export', title:t('exp.title'), error:'',
        text:t('exp.text', { count:tn('shapes', store.shapes.length) }),
        textarea:JSON.stringify(payload(), null, 2) });
    }
    function download(name, text) {
      try {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type:'application/json' }));
        a.download = name; document.body.appendChild(a); a.click(); a.remove();
        markExported();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      } catch (e) { toast(t('toast.dlFail')); }
    }
    function copyExport() {
      if (!navigator.clipboard) { toast(t('toast.clipNA')); return; }
      navigator.clipboard.writeText(modal.textarea).then(() => { markExported(); toast(t('toast.copied')); })
        .catch(() => toast(t('toast.clipBlocked')));
    }
    function openImport() { Object.assign(modal, { open:true, kind:'import', title:t('imp.title'), textarea:'', error:'', importMode:'replace' }); }
    function onImportFile(e) {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { modal.textarea = String(rd.result); modal.error = ''; };
      rd.readAsText(f);
    }
    function doImport() {
      let data;
      try { data = JSON.parse(modal.textarea); }
      catch (err) { modal.error = t('imp.errJson'); return; }
      const list = Array.isArray(data) ? data : (data && Array.isArray(data.shapes) ? data.shapes : (data && data.pieces ? [data] : null));
      if (!list || !list.length) { modal.error = t('imp.errEmpty'); return; }
      const replace = modal.importMode === 'replace';
      const ids = new Set(replace ? [] : store.shapes.map(s => s.id)), now = Date.now();
      const cats = replace ? [] : store.categories.slice();
      const addCat = c => { if (typeof c === 'string' && c && !cats.includes(c)) cats.push(c); };
      if (data && Array.isArray(data.categories)) data.categories.forEach(addCat);
      const fresh = [];
      for (const s of list) {
        if (!s || !s.pieces) continue;
        const id = s.id && !ids.has(s.id) ? s.id : uid(); ids.add(id);
        const cat = typeof s.category === 'string' ? s.category : '';
        addCat(cat);
        fresh.push({ id, name:String(s.name || t('doc.untitled')), category:cat, pieces:normalizePieces(s.pieces), created:+s.created || now, updated:+s.updated || now });
      }
      if (replace) store.shapes.splice(0, store.shapes.length, ...fresh);
      else store.shapes.push(...fresh);
      store.categories.splice(0, store.categories.length, ...cats);
      // odkazy na smazané obrazce
      const exists = id => store.shapes.some(s => s.id === id);
      if (doc.id && !exists(doc.id)) doc.id = null;
      printSel.value = printSel.value.filter(exists);
      closeModal(false);
      persist().then(() => { if (replace && storage.mode === 'local') markExported(); });   // data teď odpovídají souboru
      toast(t(replace ? 'toast.replaced' : 'toast.imported', { count:tn('shapes', fresh.length) }));
    }

    /* ----- tisk ----- */
    const printOpts = reactive({ layout:'cards', style:'task', perCard:1, cropMarks:true, cardOutline:true, cardNumber:true, duplex:false,
      perPage:4, sizeMode:'fit', sideMm:100, frame:true, showName:true, showCategory:false, colorSolution:false, catFilter:'' });
    const printList = computed(() => store.shapes.filter(s => printOpts.catFilter === '' ||
      (printOpts.catFilter === '__none' ? !s.category : s.category === printOpts.catFilter)));
    const selectPrintList = () => { printList.value.forEach(s => { if (!printSel.value.includes(s.id)) printSel.value.push(s.id); }); };

    // Jedna buňka s obrazcem uvnitř obdélníku box (vše v mm)
    function cellFor(it, box, fs, pad, frame) {
      const title = printOpts.showName ? it.s.name + (it.kind === 'solution' ? t('pr.solSuffix') : '') : (it.kind === 'solution' ? t('pr.solLabel') : '');
      const sub = printOpts.showCategory ? (it.s.category || '') : '';
      const sfs = fs * 0.75;
      let head = 0, t1y = 0, t2y = 0;
      if (title) { t1y = box.y + pad + fs; head = fs * 1.3; }
      if (sub) { t2y = box.y + pad + head + sfs; head += sfs * 1.35; }
      if (head) head += fs * 0.4;
      const dx = box.x + pad, dy = box.y + pad + head;
      const dw = Math.max(box.w - 2 * pad, 1), dh = Math.max(box.h - 2 * pad - head, 1);
      const b = bboxOf(it.s.pieces), fit = Math.min(dw / b.w, dh / b.h);
      let sc = fit, shrunk = false;
      if (printOpts.layout === 'pages') {
        sc = fit * 0.94;
        if (printOpts.sizeMode === 'real') { const real = (+printOpts.sideMm || 100) / 200; if (real <= fit) sc = real; else { sc = fit; shrunk = true; } }
      }
      // dlouhý text: nejdřív zmenšit písmo, a když to nestačí, stlačit ho na šířku buňky
      const maxW = box.w - 2 * pad - 1;
      const fitText = (txt, size) => {
        const est = txt.length * size * 0.56;
        if (est <= maxW) return { fs:size, tl:null };
        const smaller = Math.max(size * 0.7, maxW / (txt.length * 0.56));
        return { fs:smaller, tl:txt.length * smaller * 0.56 > maxW ? maxW : null };
      };
      const tf = fitText(title, fs), sf = fitText(sub, sfs);
      return { key:it.s.id + it.kind + '_' + box.x.toFixed(1) + '_' + box.y.toFixed(1), x:box.x, y:box.y, w:box.w, h:box.h,
        cx:box.x + box.w / 2, frame, fs:tf.fs, tl:tf.tl, sfs:sf.fs, stl:sf.tl, title, sub, t1y, t2y, kind:it.kind, pieces:it.s.pieces, sc, shrunk,
        tx:dx + (dw - b.w * sc) / 2 - b.x * sc, ty:dy + (dh - b.h * sc) / 2 - b.y * sc };
    }
    // Volné stránky (původní režim)
    const LAYOUTS = { 1:[1,1], 2:[1,2], 4:[2,2], 6:[2,3], 8:[2,4], 10:[2,5], 12:[3,4] };
    function sheetPages(items) {
      const per = printOpts.perPage, [cols, rows] = LAYOUTS[per] || [2,2];
      const M = 14, G = 6, areaW = 210 - 2 * M, areaH = 297 - 2 * M - 8;
      const cw = (areaW - G * (cols - 1)) / cols, ch = (areaH - G * (rows - 1)) / rows;
      const out = [];
      items.forEach((it, i) => {
        const pi = Math.floor(i / per), ci = i % per;
        if (!out[pi]) out[pi] = { cells:[], frames:[], marks:null, footer:true };
        const box = { x:M + (ci % cols) * (cw + G), y:M + Math.floor(ci / cols) * (ch + G), w:cw, h:ch };
        const m = Math.min(cw, ch);              // menší buňky = menší písmo a okraje
        out[pi].cells.push(cellFor(it, box, clamp(m * 0.06, 2.8, 4.4), clamp(m * 0.07, 3, 6), printOpts.frame));
      });
      return out;
    }
    // Karty 98 × 94,5 mm, 6 na A4
    function cardPages(tasks, sols) {
      const per = printOpts.perCard === 4 ? 4 : 1;
      const chunk = arr => { const r = []; for (let i = 0; i < arr.length; i += per) r.push({ items:arr.slice(i, i + per), num:r.length + 1 }); return r; };
      const tCards = chunk(tasks), sCards = chunk(sols);
      const ox = (210 - CARD_W * 2) / 2, oy = (297 - CARD_H * 3) / 2;
      const marks = [];
      const L = 4, G = 1.2, xs = [ox, ox + CARD_W, ox + 2 * CARD_W], ys = [0, 1, 2, 3].map(k => oy + k * CARD_H);
      xs.forEach(x => { marks.push([x, oy - G - L, x, oy - G]); marks.push([x, oy + 3 * CARD_H + G, x, oy + 3 * CARD_H + G + L]); });
      ys.forEach(y => { marks.push([ox - G - L, y, ox - G, y]); marks.push([ox + 2 * CARD_W + G, y, ox + 2 * CARD_W + G + L, y]); });
      const buildPage = (cards, mirror) => {
        const pg = { cells:[], frames:[], marks:printOpts.cropMarks ? marks : null, footer:false };
        cards.forEach((card, i) => {
          let col = i % 2; const row = Math.floor(i / 2);
          if (mirror) col = 1 - col;                  // zadní strana: sloupce zrcadlově
          const fx = ox + col * CARD_W, fy = oy + row * CARD_H;
          pg.frames.push({ key:'f' + i, x:fx, y:fy, w:CARD_W, h:CARD_H, num:card.num });
          if (per === 1) pg.cells.push(cellFor(card.items[0], { x:fx, y:fy, w:CARD_W, h:CARD_H }, 3.6, 5, false));
          else {
            const pad = 3.5, g = 2, sw = (CARD_W - 2 * pad - g) / 2, sh = (CARD_H - 2 * pad - g) / 2;
            card.items.forEach((it, j) => {
              let sc = j % 2; const sr = Math.floor(j / 2);
              if (mirror) sc = 1 - sc;
              pg.cells.push(cellFor(it, { x:fx + pad + sc * (sw + g), y:fy + pad + sr * (sh + g), w:sw, h:sh }, 2.6, 1.5, false));
            });
          }
        });
        return pg;
      };
      const out = [];
      if (printOpts.style === 'both' && printOpts.duplex) {
        for (let i = 0; i < tCards.length; i += 6) { out.push(buildPage(tCards.slice(i, i + 6), false)); out.push(buildPage(sCards.slice(i, i + 6), true)); }
      } else {
        const all = tCards.concat(sCards);
        for (let i = 0; i < all.length; i += 6) out.push(buildPage(all.slice(i, i + 6), false));
      }
      return out;
    }
    const pages = computed(() => {
      const shapes = store.shapes.filter(s => printSel.value.includes(s.id));
      const tasks = printOpts.style !== 'solution' ? shapes.map(s => ({ s, kind:'task' })) : [];
      const sols = printOpts.style !== 'task' ? shapes.map(s => ({ s, kind:'solution' })) : [];
      return printOpts.layout === 'cards' ? cardPages(tasks, sols) : sheetPages(tasks.concat(sols));
    });
    const printFill = (c, p) => c.kind === 'task' ? '#1f1f1f' : (printOpts.colorSolution ? DEF[p.type].color : '#ffffff');
    const doPrint = () => { try { window.print(); } catch (e) { toast(t('toast.printFail')); } };

    /* ----- klávesnice ----- */
    function onKey(e) {
      if (modal.open) { if (e.key === 'Escape') closeModal(false); return; }
      if (page.value !== 'tangram') return;
      const tag = (e.target.tagName || '').toLowerCase();
      const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
      const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
      if (mod && k === 's') { e.preventDefault(); saveDoc(); return; }
      if (typing) return;
      if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
      if (mod && k === 'y') { e.preventDefault(); redo(); return; }
      if (mod) return;
      if (e.key === 'Escape') { selectedId.value = null; return; }
      if (e.key === '0') { resetView(); return; }
      if (e.key === 'Home') { e.preventDefault(); fitView(); return; }
      if (k === 'c') { centerShape(); return; }
      const p = sel.value;
      if (!p) return;
      const st = e.shiftKey ? 10 : 1;
      switch (e.key) {
        case 'ArrowLeft':  pushHistory(); p.x = r2(p.x - st); break;
        case 'ArrowRight': pushHistory(); p.x = r2(p.x + st); break;
        case 'ArrowUp':    pushHistory(); p.y = r2(p.y - st); break;
        case 'ArrowDown':  pushHistory(); p.y = r2(p.y + st); break;
        default:
          if (k === 'q') rotSel(-stepVal.value);
          else if (k === 'e' || k === 'r') rotSel(stepVal.value);
          else if (k === 'f') flipSel();
          else return;
      }
      e.preventDefault();
    }
    const beforeUnload = e => { if (dirty.value) { e.preventDefault(); e.returnValue = ''; } };

    let ro;
    onMounted(() => {
      ro = new ResizeObserver(() => {
        const r = editorEl.value.getBoundingClientRect();
        if (r.width > 0) { size.w = r.width; size.h = r.height; }
        if (!fitted && r.width > 50) fitView();
      });
      ro.observe(editorEl.value);
      svgEl.value.addEventListener('wheel', onWheel, { passive:false });
      window.addEventListener('keydown', onKey);
      window.addEventListener('beforeunload', beforeUnload);
      detectServer();
    });
    onBeforeUnmount(() => {
      ro && ro.disconnect();
      window.removeEventListener('keydown', onKey); window.removeEventListener('beforeunload', beforeUnload);
    });

    const fmtN = v => String(r2(v));
    const fmtDec = v => lang.value === 'cs' ? String(v).replace('.', ',') : String(v);
    const fmtDeg = v => fmtDec(r2(v)) + '°';

    return {
      t, tn, lang, langs:LANGS, langCodes, setLang,
      store, page, tabs, settings, stepVal, clampStep, doc, dirty, statusText, selectedId, sel, selDef, pieceBy,
      previewMode, fine, history, pushHistory, undo, redo, toastMsg, modal, closeModal,
      editorEl, svgEl, catInput, view, vb, viewBox, zoomPct, gridD, zoomBy, resetView, fitView,
      pts, fillFor, strokeFor, rotSel, flipSel, setField, centerShape, scatterPieces, squarePieces, normDeg,
      cursor, snapPoint, dragState, onPiecePointerDown, onBgPointerDown, onPointerMove, onPointerUp, onPieceContext,
      goPage, newShape, openShape, saveDoc, docJson, docSize, catAdd, openCatAdd, confirmCategory,
      gen, generateAll, rerollGenerated, openGenerator, useGenerated,
      gal, galleryShapes, duplicateShape, deleteShape, printSel, togglePrint,
      openExport, download, copyExport, openImport, onImportFile, doImport,
      printOpts, pages, printFill, printList, selectPrintList, storage, exportState, fmtTime, CARD_W, CARD_H,
      doPrint, fmtDate, fmtN, fmtDec, fmtDeg,
      pieceDefs:PIECE_DEFS, logoPieces:makePieces(1),
    };
  },
}).mount('#app');
